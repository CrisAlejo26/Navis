<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <!-- Se recarga sola: cuando la app vuelva a estar arriba, entra sin tocar nada. -->
    <meta http-equiv="refresh" content="15" />
    <title>PastorTools — preparando la aplicación</title>
    <style>
      :root {
        --fondo: #fcfcfa;
        --texto: #181b1f;
        --suave: #636975;
        --tarjeta: #ffffff;
        --borde: #dee1e7;
        --marca: #3b63be;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fondo: #0d0f15;
          --texto: #f0f2f5;
          --suave: #989fab;
          --tarjeta: #15181f;
          --borde: #2b303b;
          --marca: #6b95ee;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--fondo);
        color: var(--texto);
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
      }
      main {
        width: 100%;
        max-width: 32rem;
        text-align: center;
        background: var(--tarjeta);
        border: 1px solid var(--borde);
        border-radius: 1rem;
        padding: 2.5rem 1.5rem;
      }
      svg {
        width: 4rem;
        height: 4rem;
      }
      h1 {
        margin: 1.25rem 0 0.5rem;
        font-size: 1.5rem;
        line-height: 1.3;
      }
      p {
        margin: 0 auto;
        max-width: 26rem;
        color: var(--suave);
      }
      .barra {
        margin: 1.75rem auto 0;
        width: min(16rem, 100%);
        height: 0.375rem;
        border-radius: 999px;
        background: color-mix(in oklab, var(--marca) 18%, transparent);
        overflow: hidden;
      }
      .barra span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: var(--marca);
        animation: avanza 1.6s ease-in-out infinite;
      }
      @keyframes avanza {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      /* Sin animación para quien la haya desactivado en su sistema. */
      @media (prefers-reduced-motion: reduce) {
        .barra span {
          animation: none;
          width: 100%;
        }
      }
      footer {
        margin-top: 1.75rem;
        font-size: 0.875rem;
        color: var(--suave);
      }
      a {
        color: var(--marca);
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 64 64" role="img" aria-label="PastorTools">
        <rect width="64" height="64" rx="14" fill="#4f46e5" />
        <path d="M32 12v40M20 24h24" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
      </svg>

      <h1>Estamos preparando PastorTools</h1>
      <p>
        La aplicación se está desplegando. Esta página se actualiza sola cada quince segundos, así
        que puedes dejarla abierta.
      </p>

      <div class="barra" role="progressbar" aria-label="Desplegando"><span></span></div>

      <footer>
        Proyecto open source ·
        <a href="https://github.com/CrisAlejo26/PastorTools">GitHub</a>
      </footer>
    </main>
  </body>
</html>
