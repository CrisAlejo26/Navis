# Proxy inverso de PastorTools en el VPS.
#
#   sudo cp docker/nginx/pastortools.officetools.es.conf \
#     /etc/nginx/sites-available/pastortools.officetools.es
#   sudo ln -s /etc/nginx/sites-available/pastortools.officetools.es \
#     /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pastortools.officetools.es
#
# Certbot reescribe este fichero al emitir el certificado: añade el bloque 443
# y convierte el 80 en una redirección.

server {
    listen 80;
    server_name pastortools.officetools.es;

    client_max_body_size 25m;

    # La API y la autenticación van al contenedor de NestJS. Better Auth vive
    # en /api/auth y el dominio en /api/v1, así que un solo prefijo los cubre.
    location /api/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Sonda de salud, fuera del prefijo /api a propósito.
    location = /health {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        access_log off;
    }

    # Todo lo demás es la PWA servida por su propio nginx.
    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
