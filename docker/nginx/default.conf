server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Los assets llevan hash en el nombre: se pueden cachear para siempre.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # El service worker NO se cachea: si se cachea, la app se queda congelada en
  # una versión antigua y el aviso de actualización nunca llega.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location = /registerSW.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    types { application/manifest+json webmanifest; }
  }

  # SPA: cualquier ruta desconocida la resuelve React Router.
  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
