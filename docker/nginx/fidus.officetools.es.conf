# Proxy inverso de Navis en el VPS.
#
#   sudo cp docker/nginx/navis.officetools.es.conf \
#     /etc/nginx/sites-available/navis.officetools.es
#   sudo ln -s /etc/nginx/sites-available/navis.officetools.es \
#     /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d navis.officetools.es
#
# Certbot reescribe este fichero al emitir el certificado: añade el bloque 443
# y convierte el 80 en una redirección.

server {
    listen 80;
    server_name navis.officetools.es;

    client_max_body_size 25m;

    # Mientras los contenedores no estén arriba (despliegue, reinicio, build),
    # en vez de un 502 en blanco se sirve una página que lo explica y se
    # recarga sola. El 503 le dice a Google y compañía que no es permanente.
    # `=503` fuerza ese código en la respuesta: «vuelve luego», no «esto es lo
    # que hay». Sin él, nginx devolvería un 200 con la página de espera y los
    # buscadores la indexarían como si fuese el contenido real del sitio.
    error_page 502 503 504 =503 @mantenimiento;

    location @mantenimiento {
        root /var/www/navis;
        try_files /mantenimiento.html =503;
    }

    # La API y la autenticación van al contenedor de NestJS. Better Auth vive
    # en /api/auth y el dominio en /api/v1, así que un solo prefijo los cubre.
    location /api/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Sonda de salud, fuera del prefijo /api a propósito.
    location = /health {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        access_log off;
    }

    # Todo lo demás es la PWA servida por su propio nginx.
    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
