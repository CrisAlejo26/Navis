# Entorno de PRODUCCIÓN (autoalojado).
#
#   pnpm docker:prod
#
# Diferencias con el de desarrollo:
#   · Postgres no publica su puerto: solo se llega desde la red interna.
#   · No hay perfiles de herramientas (nada de Adminer expuesto).
#   · Todos los secretos vienen del .env; ninguno tiene valor por defecto.

name: navis-prod

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB}
    volumes:
      # En postgres:18 el volumen va en /var/lib/postgresql, no en su
      # subcarpeta /data: montarlo dentro impide arrancar la imagen.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment: &api-env
      NODE_ENV: production
      DB_DRIVER: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?falta BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?falta BETTER_AUTH_URL}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:?falta AUTH_TRUSTED_ORIGINS}
      CORS_ORIGINS: ${CORS_ORIGINS:?falta CORS_ORIGINS}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai:8000}
    ports:
      # Solo escucha en localhost: quien publica al mundo es el proxy inverso
      # (nginx). Sin el 127.0.0.1, la API quedaría expuesta saltándoselo.
      - "127.0.0.1:${API_PORT:-3000}:3000"

  # Contenedor de un solo uso: aplica las migraciones y sale. No se levanta con
  # `up` (está bajo un perfil), solo con:
  #   docker compose -f docker-compose.prod.yml run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: migrate
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: *api-env

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?falta VITE_API_URL}
        VITE_AUTH_URL: ${VITE_AUTH_URL:?falta VITE_AUTH_URL}
        VITE_SITE_URL: ${VITE_SITE_URL:?falta VITE_SITE_URL}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"

  # Microservicio de IA. Bajo perfil: solo se levanta si se pide, porque
  # todavía es un esqueleto (ver apps/ai/README.md).
  #   docker compose -f docker-compose.prod.yml --profile ai up -d
  ai:
    build:
      context: .
      dockerfile: docker/ai.Dockerfile
    profiles: ["ai"]
    restart: unless-stopped
    # No publica puerto: solo lo llama la API por la red interna de compose.
    expose:
      - "8000"

volumes:
  postgres-data:
