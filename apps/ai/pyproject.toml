[project]
name = "fidus-ai"
version = "0.1.0"
description = "Microservicio de IA de Fidus (esqueleto)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.52.1",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.0", "ruff>=0.16.0", "httpx>=0.28.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"
