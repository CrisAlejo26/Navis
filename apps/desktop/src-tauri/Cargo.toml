[package]
name = "pastortools-desktop"
version = "0.1.0"
description = "PastorTools — herramientas para pastores e iglesias"
authors = ["PastorTools"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

# El binario y la librería comparten nombre: `main.rs` solo llama a `run()` de
# `lib.rs`, que es lo que también usa el objetivo móvil de Tauri.
[lib]
name = "pastortools_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-os = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-window-state = "2.4.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
