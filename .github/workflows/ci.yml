name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # El workflow de despliegue lo invoca como puerta de entrada: si algo de
  # aquí falla, no se construye ninguna imagen ni se toca producción.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Sin esto el .env falta y los tests que importan la config no arrancan.
  BETTER_AUTH_SECRET: ci-secret-solo-para-tests-con-mas-de-32-caracteres
  DB_DRIVER: sqlite
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  check:
    name: Formato, lint, tipos y tests
    runs-on: ubuntu-latest
    # De escritura para poder subir el formato arreglado (ver el paso «Formato»).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Compilar los paquetes compartidos
        run: pnpm build:packages

      # Una coma mal puesta no puede tumbar un despliegue.
      #
      # Antes esto era `format:check` a secas y moría en rojo; ahora **formatea
      # y sigue**, y si ha cambiado algo lo sube en un commit aparte para que el
      # repositorio no se quede desincronizado. El commit lleva `[skip ci]`
      # porque lo que hay que verificar ya se está verificando aquí, con los
      # ficheros ya corregidos —y sin eso, el push cancelaría esta misma
      # ejecución por la regla de `concurrency`—.
      #
      # La red de seguridad de verdad es el hook de `pre-commit`, que formatea
      # antes de que nada de esto salga de tu máquina. Esto es el respaldo.
      - name: Formato
        run: pnpm format

      - name: Subir el formato arreglado
        # Solo en ramas de este repositorio: en un `pull_request` lo que hay
        # bajado es el commit de mezcla, y empujarlo sería empujar otra cosa.
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "Todo estaba formateado."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: formatear con prettier [skip ci]'

          # Sin permiso de escritura —al llamarlo desde otro workflow, por
          # ejemplo— esto no puede fallar la verificación: se avisa y se sigue.
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::No se ha podido subir el formato; queda arreglado solo en esta ejecución."

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:scripts

      # Que compile es parte de la verificación: un fallo de build no puede
      # descubrirse al desplegar.
      - run: pnpm build

  e2e-api:
    name: Tests e2e de la API (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: navis
          POSTGRES_PASSWORD: navis_ci
          POSTGRES_DB: navis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U navis"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_DRIVER: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: navis
      POSTGRES_PASSWORD: navis_ci
      POSTGRES_DB: navis_test
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages

      - name: Migraciones (Better Auth primero, después TypeORM)
        run: pnpm db:migrate

      - run: pnpm --filter @navis/api test:e2e

  e2e-web:
    name: Tests e2e de la web (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm --filter @navis/web exec playwright install --with-deps chromium
      - run: pnpm --filter @navis/web test:e2e

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  mobile:
    name: Expo doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm --filter @navis/mobile exec expo-doctor

  desktop:
    name: Compilar Rust (Tauri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Dependencias de sistema de Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      # La web tiene que existir: tauri.conf.json apunta a apps/web/dist.
      - run: pnpm build:web

      - name: cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked

  docker:
    name: Construir imágenes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3

      - name: API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
