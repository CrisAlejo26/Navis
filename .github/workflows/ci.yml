name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # El workflow de despliegue lo invoca como puerta de entrada: si algo de
  # aquí falla, no se construye ninguna imagen ni se toca producción.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Sin esto el .env falta y los tests que importan la config no arrancan.
  BETTER_AUTH_SECRET: ci-secret-solo-para-tests-con-mas-de-32-caracteres
  DB_DRIVER: sqlite
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  check:
    name: Formato, lint, tipos y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Compilar los paquetes compartidos
        run: pnpm build:packages

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Que compile es parte de la verificación: un fallo de build no puede
      # descubrirse al desplegar.
      - run: pnpm build

  e2e-api:
    name: Tests e2e de la API (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pastortools
          POSTGRES_PASSWORD: pastortools_ci
          POSTGRES_DB: pastortools_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pastortools"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_DRIVER: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: pastortools
      POSTGRES_PASSWORD: pastortools_ci
      POSTGRES_DB: pastortools_test
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages

      - name: Migraciones (Better Auth primero, después TypeORM)
        run: pnpm db:migrate

      - run: pnpm --filter @pastortools/api test:e2e

  e2e-web:
    name: Tests e2e de la web (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm --filter @pastortools/web exec playwright install --with-deps chromium
      - run: pnpm --filter @pastortools/web test:e2e

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  mobile:
    name: Expo doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm --filter @pastortools/mobile exec expo-doctor

  desktop:
    name: Compilar Rust (Tauri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Dependencias de sistema de Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      # La web tiene que existir: tauri.conf.json apunta a apps/web/dist.
      - run: pnpm build:web

      - name: cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked

  docker:
    name: Construir imágenes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3

      - name: API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
